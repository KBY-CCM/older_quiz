<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뭐가 더 오래 됐을까?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #232323; color: #fff;
    font-family: "Noto Sans KR", "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  body { min-height: 100vh; padding: 28px 24px 60px; }

  .top { position: relative; display: flex; justify-content: center; align-items: flex-start; margin-bottom: 10px; }
  .title-pill { background: #fff; color: #111; font-size: 26px; font-weight: 800;
    padding: 12px 34px; border-radius: 14px; }
  .score-chip { position: absolute; right: 0; top: 4px; background: #fff; border-radius: 10px;
    padding: 8px 16px; font-size: 15px; color: #888; font-weight: 600; }
  .score-chip b { font-weight: 800; }
  .score-chip .ok { color: #2eaf5f; }
  .score-chip .prog { color: #4a7cf7; }
  .score-chip .total { color: #333; }

  .verdict { text-align: center; font-size: 40px; font-weight: 900; height: 56px; margin: 14px 0 6px;
    letter-spacing: 2px; }
  .verdict.correct { color: #4a7cf7; }
  .verdict.wrong { color: #f04e4e; }

  .nextbar { display: flex; justify-content: flex-end; height: 44px; margin-bottom: 8px; }
  .btn-next { background: #fff; color: #111; border: none; font-size: 17px; font-weight: 700;
    padding: 9px 22px; border-radius: 10px; cursor: pointer; }
  .btn-next:hover { background: #e8e8e8; }

  .arena { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 1100px; margin: 0 auto; }
  .side { display: flex; flex-direction: column; }
  .imgbox { position: relative; width: 100%; aspect-ratio: 1 / 1.15; background: #141414;
    border-radius: 6px; overflow: hidden; }
  .imgbox img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .yearlay { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center;
    font-size: 42px; font-weight: 900; color: #fff;
    text-shadow: 0 0 8px rgba(0,0,0,.9), 0 2px 14px rgba(0,0,0,.9); display: none; }
  .revealed .yearlay { display: block; }

  .btn-choice { margin-top: 16px; border: none; border-radius: 10px; padding: 15px 10px;
    font-size: 26px; font-weight: 800; color: #fff; cursor: pointer; transition: filter .12s; }
  .btn-choice:hover { filter: brightness(1.12); }
  .side-a .btn-choice { background: #4a7cf7; }
  .side-b .btn-choice { background: #f04e4e; }
  .revealed .btn-choice { cursor: default; }
  .revealed .btn-choice:hover { filter: none; }
  .revealed .btn-choice.dim { background: #9a9a9a; color: #eee; }

  .desc { margin: 16px 8px 0; font-size: 16.5px; line-height: 1.65; color: #e8e8e8; display: none;
    white-space: pre-wrap; }
  .revealed .desc { display: block; }

  .nav { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 34px; }
  .nav button { background: #3a3a3a; color: #ddd; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .nav button:hover:not(:disabled) { background: #4a4a4a; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav .qpos { font-size: 15px; color: #999; font-weight: 700; min-width: 70px; text-align: center; }
  .btn-jump { background: #fff !important; color: #111 !important; font-weight: 800 !important; }
  .peek-badge { text-align: center; margin-top: 12px; font-size: 14px; color: #f0c04e; font-weight: 700;
    display: none; }

  /* 결과 화면 */
  .result { display: none; text-align: center; padding-top: 40px; }
  .result h2 { font-size: 30px; font-weight: 800; margin-bottom: 26px; color: #ddd; }
  .result .big { font-size: 74px; font-weight: 900; margin-bottom: 8px; }
  .result .big .ok { color: #4a7cf7; }
  .result .pct { font-size: 20px; color: #999; margin-bottom: 44px; }
  .result .actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .result .actions button { border: none; border-radius: 12px; padding: 16px 28px; font-size: 19px;
    font-weight: 800; cursor: pointer; }
  .btn-shuffle { background: #f04e4e; color: #fff; }
  .btn-restart { background: #3a3a3a; color: #ddd; font-weight: 600 !important; }
  .round-tag { display: none; text-align: center; margin-bottom: 4px; font-size: 14px;
    font-weight: 700; color: #f04e4e; letter-spacing: 1px; }

  .btn-reset-all { position: fixed; right: 14px; bottom: 12px; background: none; border: 1px solid #444;
    color: #666; border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .btn-reset-all:hover { color: #bbb; border-color: #777; }

  @media (max-width: 760px) {
    .arena { grid-template-columns: 1fr; }
    .score-chip { position: static; margin-top: 10px; }
    .top { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="title-pill">뭐가 더 오래 됐을까?</div>
  <div class="score-chip">
    <span class="ok">정답 <b id="stat-ok">0</b></span> &nbsp;·&nbsp;
    <span class="prog">진행 <b id="stat-prog">0</b></span> &nbsp;·&nbsp;
    <span class="total">전체 <b id="stat-total">50</b></span>
  </div>
</div>

<div class="round-tag" id="round-tag">🔀 셔플 라운드</div>
<div class="verdict" id="verdict"></div>
<div class="nextbar"><button class="btn-next" id="btn-next" style="display:none">다음 문제</button></div>

<div id="quiz">
  <div class="arena" id="arena">
    <div class="side side-a" id="side-a">
      <div class="imgbox"><img id="img-a" alt=""><div class="yearlay" id="year-a"></div></div>
      <button class="btn-choice" id="btn-a"></button>
      <div class="desc" id="desc-a"></div>
    </div>
    <div class="side side-b" id="side-b">
      <div class="imgbox"><img id="img-b" alt=""><div class="yearlay" id="year-b"></div></div>
      <button class="btn-choice" id="btn-b"></button>
      <div class="desc" id="desc-b"></div>
    </div>
  </div>
  <div class="peek-badge" id="peek-badge"></div>
  <div class="nav">
    <button id="btn-prev">◀ 이전</button>
    <span class="qpos" id="qpos"></span>
    <button id="btn-fwd">다음 ▶</button>
    <button class="btn-jump" id="btn-jump" style="display:none">현재 문제로 ↩</button>
  </div>
</div>

<div class="result" id="result">
  <h2>모든 문제 완료!</h2>
  <div class="big"><span class="ok" id="res-ok">0</span> <span style="color:#666">/</span> <span id="res-total">50</span></div>
  <div class="pct" id="res-pct"></div>
  <div class="actions">
    <button class="btn-shuffle" id="btn-shuffle">🔀 다 섞어서 다시 맞추기</button>
    <button class="btn-restart" id="btn-restart">원래 순서로 처음부터</button>
  </div>
  <div class="nav" style="margin-top:50px">
    <button id="btn-review">◀ 문제 다시 보기</button>
  </div>
</div>

<button class="btn-reset-all" id="btn-reset-all">기록 초기화</button>

<script src="data.js"></script>
<script>
(function () {
  const Q = window.QUESTIONS;
  const N = Q.length;
  const LSKEY = "older_quiz_v1";

  // ---- 상태 ----
  // order: 이번 라운드의 문제 순서 (Q 인덱스 배열)
  // swap: 각 문제의 좌우 반전 여부
  // answers: 답변 기록. answers[i] = "a" | "b" (order 기준 i번째 문제, 화면 기준 아님)
  // shuffled: 셔플 라운드 여부
  let S = load() || freshState(false);
  // view: 지금 보고 있는 위치 (0 ~ progress). progress === N 이면 "end" 뷰 가능
  let view = Math.min(S.answers.length, N - 1);
  let atEnd = S.answers.length >= N;
  if (atEnd) view = "end";

  function freshState(shuffle) {
    const order = [...Array(N).keys()];
    const swap = Array(N).fill(false);
    if (shuffle) {
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      for (let i = 0; i < N; i++) swap[i] = Math.random() < 0.5;
    }
    return { order, swap, answers: [], shuffled: shuffle };
  }
  function save() { try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(LSKEY));
      if (s && Array.isArray(s.order) && s.order.length === N) return s;
    } catch (e) {}
    return null;
  }

  const $ = (id) => document.getElementById(id);
  const progress = () => S.answers.length;          // 답변한 개수 = 현재 문제 위치
  const correctCount = () =>
    S.answers.reduce((n, ch, i) => n + (isCorrect(i, ch) ? 1 : 0), 0);

  // i번째(순서 기준) 문제를 화면 좌(a)/우(b)로 변환
  function sides(i) {
    const q = Q[S.order[i]];
    return S.swap[i] ? { a: q.b, b: q.a } : q;
  }
  function isCorrect(i, choice) {
    const s = sides(i);
    return s[choice].val < s[choice === "a" ? "b" : "a"].val;
  }

  function render() {
    // 상단 스탯
    $("stat-ok").textContent = correctCount();
    $("stat-prog").textContent = progress();
    $("stat-total").textContent = N;

    $("round-tag").style.display = S.shuffled ? "block" : "none";

    if (view === "end") { renderEnd(); return; }
    $("quiz").style.display = "block";
    $("result").style.display = "none";

    const i = view;
    const s = sides(i);
    const answered = i < S.answers.length;
    const choice = answered ? S.answers[i] : null;

    $("img-a").src = encodeURI(s.a.img);
    $("img-b").src = encodeURI(s.b.img);
    $("btn-a").textContent = s.a.name;
    $("btn-b").textContent = s.b.name;
    $("year-a").textContent = s.a.year;
    $("year-b").textContent = s.b.year;
    $("desc-a").textContent = s.a.desc || "";
    $("desc-b").textContent = s.b.desc || "";

    document.querySelectorAll(".side").forEach(el => el.classList.toggle("revealed", answered));
    $("btn-a").classList.toggle("dim", answered && choice !== "a");
    $("btn-b").classList.toggle("dim", answered && choice !== "b");

    const v = $("verdict");
    if (answered) {
      const ok = isCorrect(i, choice);
      v.textContent = ok ? "정답!" : "오답!";
      v.className = "verdict " + (ok ? "correct" : "wrong");
    } else {
      v.textContent = "";
      v.className = "verdict";
    }

    // "다음 문제" 버튼: 방금 답한 최신 문제를 보고 있을 때만
    const onLatest = answered && i === S.answers.length - 1;
    $("btn-next").style.display = onLatest ? "inline-block" : "none";
    if (onLatest) $("btn-next").textContent = S.answers.length === N ? "결과 보기" : "다음 문제";

    // 네비게이션
    $("qpos").textContent = (i + 1) + " / " + N;
    $("btn-prev").disabled = i === 0;
    // 앞으로: 이미 답한 범위 안에서만 (현재 미답변 문제가 마지노선)
    const maxView = Math.min(S.answers.length, N - 1);
    $("btn-fwd").disabled = i >= maxView;
    // 최신 위치보다 뒤에 있으면 "지난 문제 보는 중"
    const browsingPast = i < S.answers.length - 1 || (i < progress() && !onLatest);
    $("btn-jump").style.display = browsingPast ? "inline-block" : "none";
    $("btn-jump").textContent = S.answers.length === N ? "결과 화면으로 ↩" : "현재 문제로 ↩";
    $("peek-badge").style.display = browsingPast ? "block" : "none";
    $("peek-badge").textContent = "👀 지난 문제 다시 보는 중 — 기록은 그대로 유지됩니다";
  }

  function renderEnd() {
    $("quiz").style.display = "none";
    $("result").style.display = "block";
    const ok = correctCount();
    $("res-ok").textContent = ok;
    $("res-total").textContent = N;
    $("res-pct").textContent = "정답률 " + Math.round((ok / N) * 100) + "%";
  }

  // ---- 이벤트 ----
  function choose(ch) {
    if (view === "end") return;
    if (view !== progress() || view >= N) return; // 현재 문제에서만 선택 가능
    if (view < S.answers.length) return;          // 이미 답함
    S.answers.push(ch);
    save();
    render();
  }
  $("btn-a").addEventListener("click", () => choose("a"));
  $("btn-b").addEventListener("click", () => choose("b"));

  $("btn-next").addEventListener("click", () => {
    if (S.answers.length === N) { view = "end"; }
    else { view = progress(); }
    render();
  });

  $("btn-prev").addEventListener("click", () => {
    if (view === "end") { view = N - 1; }
    else if (view > 0) view--;
    render();
  });
  $("btn-fwd").addEventListener("click", () => {
    const maxView = Math.min(S.answers.length, N - 1);
    if (view !== "end" && view < maxView) view++;
    render();
  });
  $("btn-jump").addEventListener("click", () => {
    view = S.answers.length === N ? "end" : progress();
    render();
  });
  $("btn-review").addEventListener("click", () => { view = N - 1; render(); });

  $("btn-shuffle").addEventListener("click", () => {
    S = freshState(true); view = 0; save(); render();
  });
  $("btn-restart").addEventListener("click", () => {
    S = freshState(false); view = 0; save(); render();
  });
  $("btn-reset-all").addEventListener("click", () => {
    if (confirm("모든 기록을 지우고 처음부터 시작할까요?")) {
      S = freshState(false); view = 0; save(); render();
    }
  });

  // 키보드: ←/→ 탐색, Enter 다음 문제
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") $("btn-prev").click();
    else if (e.key === "ArrowRight") {
      if (view !== "end" && !$("btn-fwd").disabled) $("btn-fwd").click();
    } else if (e.key === "Enter") {
      if (view !== "end" && $("btn-next").style.display !== "none"
          && view === S.answers.length - 1) $("btn-next").click();
    }
  });

  render();
})();
</script>
</body>
</html>
