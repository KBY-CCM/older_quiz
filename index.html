<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뭐가 더 오래 됐을까?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #232323; color: #fff;
    font-family: "Noto Sans KR", "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  body { min-height: 100vh; padding: 28px 24px 60px; zoom: 0.67; }

  .top { position: relative; display: flex; justify-content: center; align-items: flex-start; margin-bottom: 10px; }
  .title-pill { background: #fff; color: #111; font-size: 26px; font-weight: 800;
    padding: 12px 34px; border-radius: 14px; }
  .score-chip { position: absolute; right: 0; top: 4px; background: #fff; border-radius: 10px;
    padding: 8px 16px; font-size: 15px; color: #888; font-weight: 600; }
  .score-chip b { font-weight: 800; }
  .score-chip .ok { color: #2eaf5f; }
  .score-chip .prog { color: #4a7cf7; }
  .score-chip .total { color: #333; }
  .btn-timeline { position: absolute; left: 0; top: 4px; background: #3a3a3a; color: #f0c04e;
    border: none; border-radius: 10px; padding: 9px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-timeline:hover { background: #4a4a4a; }

  .verdict { text-align: center; font-size: 40px; font-weight: 900; height: 56px; margin: 14px 0 6px;
    letter-spacing: 2px; }
  .verdict.correct { color: #2eaf5f; }
  .verdict.wrong { color: #f04e4e; }

  .actionbar { display: flex; justify-content: space-between; align-items: center; height: 44px; margin-bottom: 8px;
    max-width: 1100px; margin-left: auto; margin-right: auto; }
  .btn-hint { background: #f0c04e; color: #222; border: none; font-size: 16px; font-weight: 800;
    padding: 9px 18px; border-radius: 10px; cursor: pointer; }
  .btn-hint:hover:not(:disabled) { background: #ffd469; }
  .btn-hint:disabled { background: #4a4a4a; color: #888; cursor: default; }
  .hint-note { font-size: 13px; color: #a08430; margin-left: 10px; font-weight: 600; }
  .btn-next { background: #fff; color: #111; border: none; font-size: 17px; font-weight: 700;
    padding: 9px 22px; border-radius: 10px; cursor: pointer; }
  .btn-next:hover { background: #e8e8e8; }

  .qpos-top { text-align: center; font-size: 19px; font-weight: 800; color: #bbb; margin-top: 12px; }

  .stage { display: grid; grid-template-columns: auto 1fr auto; align-items: stretch; gap: 6px;
    max-width: 1240px; margin: 0 auto; }
  .chev { background: none; border: none; color: #f0c04e; font-size: 108px; font-weight: 900;
    cursor: pointer; padding: 0 8px; line-height: 1; align-self: center; user-select: none;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
    transition: color .12s, transform .12s; }
  .chev:hover:not(:disabled) { color: #ffd76e; transform: scale(1.15); }
  .chev:disabled { opacity: .12; cursor: default; }

  .arena { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 1100px; margin: 0 auto;
    flex: 1; min-width: 0; }
  .side { display: flex; flex-direction: column; }
  .imgbox { position: relative; width: 100%; aspect-ratio: 1 / 1.15; background: #141414;
    border-radius: 6px; overflow: hidden; }
  .imgbox img { width: 100%; height: 100%; object-fit: contain; display: block;
    opacity: 0; transition: opacity .15s; }
  .imgbox img.loaded { opacity: 1; }
  .yearlay { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center;
    font-size: 42px; font-weight: 900; color: #fff;
    text-shadow: 0 0 8px rgba(0,0,0,.9), 0 2px 14px rgba(0,0,0,.9); display: none; }
  .revealed .yearlay { display: block; }

  .btn-choice { margin-top: 16px; border: none; border-radius: 10px; padding: 15px 10px;
    font-size: 26px; font-weight: 800; color: #fff; cursor: pointer; transition: filter .12s; }
  .btn-choice:hover { filter: brightness(1.12); }
  .side-a .btn-choice { background: #4a7cf7; }
  .side-b .btn-choice { background: #f04e4e; }
  .revealed .btn-choice { cursor: default; }
  .revealed .btn-choice:hover { filter: none; }
  /* 공개 후: 정답은 초록, 나머지는 회색. 내가 골랐던 오답은 빨간 테두리 */
  .revealed .btn-choice.win { background: #2eaf5f !important; color: #fff; }
  .revealed .btn-choice.dim { background: #9a9a9a !important; color: #eee; }
  .revealed .btn-choice.picked-wrong { outline: 3px solid #f04e4e; outline-offset: 2px; }

  .desc { margin: 16px 8px 0; font-size: var(--desc-size, 16.5px); line-height: 1.65; color: #e8e8e8; display: none;
    white-space: pre-wrap; }
  .revealed .desc, .hinted .desc { display: block; }
  .hinted:not(.revealed) .desc { color: #d8c99a; }
  .hinted:not(.revealed) .desc:not(:empty)::before { content: "💡 "; }

  .nav { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 34px; }
  .nav button { background: #3a3a3a; color: #ddd; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .nav button:hover:not(:disabled) { background: #4a4a4a; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav .qpos { font-size: 15px; color: #999; font-weight: 700; min-width: 70px; text-align: center; }
  .btn-jump { background: #fff !important; color: #111 !important; font-weight: 800 !important; }
  .peek-badge { text-align: center; margin-top: 12px; font-size: 14px; color: #f0c04e; font-weight: 700;
    display: none; }

  /* 결과 화면 */
  .result { display: none; text-align: center; padding-top: 40px; }
  .result h2 { font-size: 30px; font-weight: 800; margin-bottom: 26px; color: #ddd; }
  .result .big { font-size: 74px; font-weight: 900; margin-bottom: 8px; }
  .result .big .ok { color: #4a7cf7; }
  .result .pct { font-size: 20px; color: #999; margin-bottom: 44px; }
  .result .actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .result .actions button { border: none; border-radius: 12px; padding: 16px 28px; font-size: 19px;
    font-weight: 800; cursor: pointer; }
  .btn-shuffle { background: #f04e4e; color: #fff; }
  .btn-restart { background: #3a3a3a; color: #ddd; font-weight: 600 !important; }
  .round-tag { display: none; text-align: center; margin-bottom: 4px; font-size: 14px;
    font-weight: 700; color: #f04e4e; letter-spacing: 1px; }

  .btn-reset-all { position: fixed; right: 14px; bottom: 12px; background: none; border: 1px solid #444;
    color: #666; border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .btn-reset-all:hover { color: #bbb; border-color: #777; }
  .btn-sound { position: fixed; left: 14px; bottom: 12px; background: none; border: 1px solid #444;
    color: #999; border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .btn-sound:hover { color: #ddd; border-color: #777; }
  .fontctl { position: fixed; left: 14px; bottom: 46px; display: flex; align-items: center; gap: 4px;
    color: #666; font-size: 12px; }
  .fontctl button { background: none; border: 1px solid #444; color: #999; border-radius: 6px;
    width: 24px; height: 22px; font-size: 13px; font-weight: 800; cursor: pointer; line-height: 1; }
  .fontctl button:hover { color: #ddd; border-color: #777; }

  /* 시작 전 이미지 프리로딩 화면 */
  .preload { position: fixed; inset: 0; background: #232323; z-index: 100;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 26px;
    transition: opacity .45s; }
  .preload.hide { opacity: 0; pointer-events: none; }
  .preload .pl-title { background: #fff; color: #111; font-size: 30px; font-weight: 800;
    padding: 14px 40px; border-radius: 16px; }
  .pre-track { width: min(460px, 70vw); height: 14px; background: #3a3a3a; border-radius: 7px; overflow: hidden; }
  .pre-bar { height: 100%; width: 0%; background: #f0c04e; border-radius: 7px; transition: width .2s; }
  .pre-txt { font-size: 16px; color: #aaa; font-weight: 600; }

  /* 역대 연표 오버레이 */
  .tl-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.86); z-index: 50; }
  .tl-overlay.open { display: flex; justify-content: center; align-items: center; }
  .tl-panel { background: #2b2b2b; border-radius: 16px; width: min(620px, 92vw); max-height: 86vh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 50px rgba(0,0,0,.6); }
  .tl-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px;
    border-bottom: 1px solid #3d3d3d; }
  .tl-head h3 { font-size: 21px; font-weight: 800; color: #f0c04e; }
  .tl-head .sub { font-size: 13px; color: #999; margin-top: 2px; font-weight: 500; }
  .tl-close { background: none; border: none; color: #999; font-size: 26px; cursor: pointer; line-height: 1; }
  .tl-close:hover { color: #fff; }
  .tl-body { overflow-y: auto; padding: 20px 28px 28px; }
  .tl-empty { color: #888; text-align: center; padding: 40px 0; font-size: 15px; }
  .tl-item { display: flex; align-items: center; gap: 14px; position: relative; padding: 9px 0 9px 24px; }
  .tl-item::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: #4a4a4a; }
  .tl-item::after { content: ""; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: #f0c04e; }
  .tl-item.new::after { background: #f04e4e; box-shadow: 0 0 0 4px rgba(240,78,78,.25); }
  .tl-item:first-child::before { top: 50%; }
  .tl-item:last-child::before { bottom: 50%; }
  .tl-item img { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; background: #141414;
    flex-shrink: 0; }
  .tl-year { font-size: 15px; font-weight: 800; color: #f0c04e; width: 132px; flex-shrink: 0; text-align: right; }
  .tl-name { font-size: 16.5px; font-weight: 700; color: #eee; }
  .tl-item.new .tl-name::after { content: "NEW"; font-size: 10px; font-weight: 900; color: #f04e4e;
    margin-left: 8px; vertical-align: 2px; letter-spacing: 1px; }

  @media (max-width: 760px) {
    .arena { grid-template-columns: 1fr; }
    .score-chip, .btn-timeline { position: static; margin-top: 10px; }
    .top { flex-direction: column; align-items: center; gap: 6px; }
  }
</style>
</head>
<body>

<div class="preload" id="preload">
  <div class="pl-title">뭐가 더 오래 됐을까?</div>
  <div class="pre-track"><div class="pre-bar" id="pre-bar"></div></div>
  <div class="pre-txt" id="pre-txt">이미지 불러오는 중...</div>
</div>

<div class="top">
  <button class="btn-timeline" id="btn-timeline">📜 역대 연표 <span id="tl-count"></span></button>
  <div class="title-pill">뭐가 더 오래 됐을까?</div>
  <div class="score-chip">
    <span class="ok">정답 <b id="stat-ok">0</b></span> &nbsp;·&nbsp;
    <span class="prog">진행 <b id="stat-prog">0</b></span> &nbsp;·&nbsp;
    <span class="total">전체 <b id="stat-total">50</b></span>
  </div>
</div>

<div class="qpos-top" id="qpos"></div>
<div class="round-tag" id="round-tag">🔀 랜덤 매치 라운드 — 원래 짝이 아닌 무작위 대결!</div>
<div class="verdict" id="verdict"></div>
<div class="actionbar">
  <span><button class="btn-hint" id="btn-hint"></button><span class="hint-note" id="hint-note"></span></span>
</div>

<div id="quiz">
  <div class="stage">
    <button class="chev" id="btn-prev" title="이전 문제">❮</button>
    <div class="arena" id="arena">
      <div class="side side-a" id="side-a">
        <div class="imgbox"><img id="img-a" alt=""><div class="yearlay" id="year-a"></div></div>
        <button class="btn-choice" id="btn-a"></button>
        <div class="desc" id="desc-a"></div>
      </div>
      <div class="side side-b" id="side-b">
        <div class="imgbox"><img id="img-b" alt=""><div class="yearlay" id="year-b"></div></div>
        <button class="btn-choice" id="btn-b"></button>
        <div class="desc" id="desc-b"></div>
      </div>
    </div>
    <button class="chev" id="btn-fwd" title="다음 문제">❯</button>
  </div>
  <div class="peek-badge" id="peek-badge"></div>
  <div class="nav">
    <button class="btn-jump" id="btn-jump" style="display:none">현재 문제로 ↩</button>
  </div>
</div>

<div class="result" id="result">
  <h2>모든 문제 완료!</h2>
  <div class="big"><span class="ok" id="res-ok">0</span> <span style="color:#666">/</span> <span id="res-total">50</span></div>
  <div class="pct" id="res-pct"></div>
  <div class="actions">
    <button class="btn-shuffle" id="btn-shuffle">🔀 항목까지 다 섞어서 랜덤 대결!</button>
    <button class="btn-restart" id="btn-restart">원래 순서로 처음부터</button>
  </div>
  <div class="nav" style="margin-top:50px">
    <button id="btn-review">◀ 문제 다시 보기</button>
  </div>
</div>

<div class="tl-overlay" id="tl-overlay">
  <div class="tl-panel">
    <div class="tl-head">
      <div>
        <h3>📜 역대 연표</h3>
        <div class="sub">지금까지 공개된 항목들 (오래된 순)</div>
      </div>
      <button class="tl-close" id="tl-close">×</button>
    </div>
    <div class="tl-body" id="tl-body"></div>
  </div>
</div>

<button class="btn-reset-all" id="btn-reset-all">기록 초기화</button>
<button class="btn-sound" id="btn-sound">🔊 효과음 켜짐</button>
<div class="fontctl"><span>설명글 크기</span>
  <button id="font-minus" title="설명글 작게">−</button>
  <button id="font-plus" title="설명글 크게">+</button>
</div>

<script src="data.js"></script>
<script>
(function () {
  const Q = window.QUESTIONS;
  const N = Q.length;
  const LSKEY = "older_quiz_v1";
  const HINT_BUDGET = 10;

  // ---- 상태 ----
  // pairs: 이번 라운드의 대결 목록. pairs[i] = [{q,s},{q,s}] (Q의 q번 문제 s쪽 항목)
  //   일반 라운드 = 원래 짝 그대로, 셔플 라운드 = 100개 항목을 전부 해체해 랜덤 재조합
  // answers: 답변 기록 / hints: 힌트 사용 여부 / shuffled: 셔플 라운드
  function itemAt(ref) { return Q[ref.q][ref.s]; }

  function freshState(shuffle) {
    let pairs;
    if (!shuffle) {
      pairs = Q.map((_, i) => [{ q: i, s: "a" }, { q: i, s: "b" }]);
    } else {
      const flat = [];
      Q.forEach((_, i) => { flat.push({ q: i, s: "a" }, { q: i, s: "b" }); });
      for (let i = flat.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flat[i], flat[j]] = [flat[j], flat[i]];
      }
      pairs = [];
      for (let i = 0; i < flat.length; i += 2) pairs.push([flat[i], flat[i + 1]]);
      // 연도(val)가 같은 동률 매치는 다른 대결과 상대를 맞바꿔 해소
      for (let k = 0; k < pairs.length; k++) {
        if (itemAt(pairs[k][0]).val !== itemAt(pairs[k][1]).val) continue;
        for (let m = 0; m < pairs.length; m++) {
          if (m === k) continue;
          const [a1, b1] = pairs[k], [a2, b2] = pairs[m];
          if (itemAt(a1).val !== itemAt(b2).val && itemAt(a2).val !== itemAt(b1).val) {
            pairs[k] = [a1, b2]; pairs[m] = [a2, b1];
            break;
          }
        }
      }
    }
    return { pairs, answers: [], hints: Array(N).fill(false), shuffled: shuffle };
  }
  function save() { try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(LSKEY));
      if (s && Array.isArray(s.pairs) && s.pairs.length === N) {
        if (!Array.isArray(s.hints) || s.hints.length !== N) s.hints = Array(N).fill(false);
        return s;
      }
      // 구버전 저장분(order/swap) 변환
      if (s && Array.isArray(s.order) && s.order.length === N) {
        const swap = Array.isArray(s.swap) ? s.swap : Array(N).fill(false);
        return {
          pairs: s.order.map((qi, i) => swap[i]
            ? [{ q: qi, s: "b" }, { q: qi, s: "a" }]
            : [{ q: qi, s: "a" }, { q: qi, s: "b" }]),
          answers: s.answers || [],
          hints: (Array.isArray(s.hints) && s.hints.length === N) ? s.hints : Array(N).fill(false),
          shuffled: !!s.shuffled,
        };
      }
    } catch (e) {}
    return null;
  }
  let S = load() || freshState(false);
  let view = Math.min(S.answers.length, N - 1);
  if (S.answers.length >= N) view = "end";

  const $ = (id) => document.getElementById(id);
  const progress = () => S.answers.length;
  const correctCount = () =>
    S.answers.reduce((n, ch, i) => n + (isCorrect(i, ch) ? 1 : 0), 0);
  const hintsUsed = () => S.hints.filter(Boolean).length;

  function sides(i) {
    return { a: itemAt(S.pairs[i][0]), b: itemAt(S.pairs[i][1]) };
  }
  function isCorrect(i, choice) {
    const s = sides(i);
    return s[choice].val < s[choice === "a" ? "b" : "a"].val;
  }

  // 연도 표기 마스킹: "1940년" "기원전 1,650년경" "1890년대" "4~12세기경" "11월" 등
  // 숫자 없이 단독으로 나오는 "기원전/기원후/서기"도 시대 힌트라 함께 가린다
  function maskYears(t) {
    return (t || "")
      .replace(/(기원전|기원후|서기)?\s*\d[\d,.~]*\s*(년대|년경|년|세기경|세기|월)/g, "●●●●")
      .replace(/기원전|기원후|서기/g, "●●●●");
  }

  // 잔상 방지: 새 이미지가 로드되기 전엔 숨김
  function setImg(el, url) {
    const u = encodeURI(url);
    if (el.getAttribute("src") === u) return;
    el.classList.remove("loaded");
    el.onload = () => el.classList.add("loaded");
    el.onerror = () => el.classList.add("loaded");
    el.src = u;
    if (el.complete && el.naturalWidth > 0) el.classList.add("loaded");
  }

  // 시작 전 전체 이미지 프리로딩
  function preloadAll() {
    const urls = [];
    Q.forEach(q => { urls.push(q.a.img); urls.push(q.b.img); });
    let done = 0, fail = 0;
    const finish = () => {
      $("pre-txt").textContent = fail ? "완료 (이미지 " + fail + "개 로드 실패)" : "완료!";
      setTimeout(() => $("preload").classList.add("hide"), 400);
    };
    urls.forEach(u => {
      const im = new Image();
      im.onload = im.onerror = (e) => {
        if (e.type === "error") fail++;
        done++;
        $("pre-bar").style.width = (done / urls.length * 100) + "%";
        $("pre-txt").textContent = "이미지 불러오는 중 " + done + " / " + urls.length;
        if (done === urls.length) finish();
      };
      im.src = encodeURI(u);
    });
  }
  preloadAll();

  function render() {
    $("stat-ok").textContent = correctCount();
    $("stat-prog").textContent = progress();
    $("stat-total").textContent = N;
    $("tl-count").textContent = progress() ? "(" + progress() * 2 + ")" : "";
    $("round-tag").style.display = S.shuffled ? "block" : "none";

    if (view === "end") { renderEnd(); return; }
    $("quiz").style.display = "block";
    $("result").style.display = "none";

    const i = view;
    const s = sides(i);
    const answered = i < S.answers.length;
    const choice = answered ? S.answers[i] : null;
    const hinted = S.hints[i];

    setImg($("img-a"), s.a.img);
    setImg($("img-b"), s.b.img);
    $("btn-a").textContent = s.a.name;
    $("btn-b").textContent = s.b.name;
    $("year-a").textContent = s.a.year;
    $("year-b").textContent = s.b.year;
    $("desc-a").textContent = answered ? (s.a.desc || "") : (hinted ? maskYears(s.a.desc) : "");
    $("desc-b").textContent = answered ? (s.b.desc || "") : (hinted ? maskYears(s.b.desc) : "");

    document.querySelectorAll(".side").forEach(el => {
      el.classList.toggle("revealed", answered);
      el.classList.toggle("hinted", hinted && !answered);
    });
    const winSide = s.a.val < s.b.val ? "a" : "b";
    ["a", "b"].forEach(k => {
      const btn = $("btn-" + k);
      btn.classList.toggle("win", answered && k === winSide);
      btn.classList.toggle("dim", answered && k !== winSide);
      btn.classList.toggle("picked-wrong", answered && choice === k && k !== winSide);
    });

    const v = $("verdict");
    if (answered) {
      const ok = isCorrect(i, choice);
      v.textContent = ok ? "정답!" : "오답!";
      v.className = "verdict " + (ok ? "correct" : "wrong");
    } else {
      v.textContent = "";
      v.className = "verdict";
    }

    // 힌트 버튼: 현재(미답변) 문제에서만
    const hb = $("btn-hint"), hn = $("hint-note");
    const hasDesc = !!(s.a.desc || s.b.desc);
    const left = HINT_BUDGET - hintsUsed();
    if (!answered && i === progress()) {
      hb.style.display = "inline-block";
      if (hinted) { hb.disabled = true; hb.textContent = "💡 힌트 사용됨"; hn.textContent = "남은 힌트 " + left + "/" + HINT_BUDGET; }
      else if (!hasDesc) { hb.disabled = true; hb.textContent = "💡 힌트 없음"; hn.textContent = "이 문제는 설명이 없어요"; }
      else if (left <= 0) { hb.disabled = true; hb.textContent = "💡 힌트 소진"; hn.textContent = "0/" + HINT_BUDGET; }
      else { hb.disabled = false; hb.textContent = "💡 힌트 보기"; hn.textContent = "남은 힌트 " + left + "/" + HINT_BUDGET; }
    } else {
      hb.style.display = "none"; hn.textContent = "";
    }

    // 네비게이션 (다음 진행도 오른쪽 꺽쇠로)
    $("qpos").style.display = "block";
    $("qpos").textContent = (i + 1) + " / " + N;
    $("btn-prev").disabled = i === 0;
    const maxView = Math.min(S.answers.length, N - 1);
    // 마지막 문제까지 다 풀었으면 오른쪽 꺽쇠가 결과 화면으로 감
    const canGoEnd = i === N - 1 && S.answers.length === N;
    $("btn-fwd").disabled = i >= maxView && !canGoEnd;
    const browsingPast = i < S.answers.length - 1;
    $("btn-jump").style.display = browsingPast ? "inline-block" : "none";
    $("btn-jump").textContent = S.answers.length === N ? "결과 화면으로 ↩" : "현재 문제로 ↩";
    $("peek-badge").style.display = browsingPast ? "block" : "none";
    $("peek-badge").textContent = "👀 지난 문제 다시 보는 중 — 기록은 그대로 유지됩니다";
  }

  function renderEnd() {
    $("quiz").style.display = "none";
    $("result").style.display = "block";
    $("qpos").style.display = "none";
    $("btn-hint").style.display = "none"; $("hint-note").textContent = "";
    $("verdict").textContent = ""; $("verdict").className = "verdict";
    const ok = correctCount();
    $("res-ok").textContent = ok;
    $("res-total").textContent = N;
    $("res-pct").textContent = "정답률 " + Math.round((ok / N) * 100) + "%";
  }

  // ---- 역대 연표 ----
  function renderTimeline() {
    const body = $("tl-body");
    const items = [];
    for (let i = 0; i < S.answers.length; i++) {
      const s = sides(i);
      items.push({ ...s.a, latest: i === S.answers.length - 1 });
      items.push({ ...s.b, latest: i === S.answers.length - 1 });
    }
    if (!items.length) {
      body.innerHTML = '<div class="tl-empty">아직 공개된 항목이 없습니다.<br>문제를 풀면 여기에 연대순으로 쌓입니다.</div>';
      return;
    }
    items.sort((x, y) => x.val - y.val);
    body.innerHTML = items.map(it =>
      '<div class="tl-item' + (it.latest ? " new" : "") + '">' +
        '<div class="tl-year">' + esc(it.year) + '</div>' +
        '<img src="' + encodeURI(it.img) + '" alt="">' +
        '<div class="tl-name">' + esc(it.name) + '</div>' +
      '</div>'
    ).join("");
  }
  function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function openTimeline() { renderTimeline(); $("tl-overlay").classList.add("open"); }
  function closeTimeline() { $("tl-overlay").classList.remove("open"); }
  $("btn-timeline").addEventListener("click", openTimeline);
  $("tl-close").addEventListener("click", closeTimeline);
  $("tl-overlay").addEventListener("click", (e) => { if (e.target === $("tl-overlay")) closeTimeline(); });

  // ---- 효과음 (Web Audio 합성, 외부 파일 없음) ----
  const SNDKEY = "older_quiz_sound";
  let soundOn = localStorage.getItem(SNDKEY) !== "off";
  let actx = null;
  function tone(freq, start, dur, type, vol) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, actx.currentTime + start);
    g.gain.linearRampToValueAtTime(vol, actx.currentTime + start + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + start + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime + start); o.stop(actx.currentTime + start + dur + 0.05);
  }
  function playSound(ok) {
    if (!soundOn) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      if (ok) { // 딩동댕 ↗
        tone(523.25, 0,    0.18, "triangle", 0.25);
        tone(659.25, 0.12, 0.18, "triangle", 0.25);
        tone(783.99, 0.24, 0.32, "triangle", 0.28);
      } else {  // 땡 (부저)
        tone(196, 0,    0.28, "square", 0.16);
        tone(147, 0.02, 0.34, "square", 0.16);
      }
    } catch (e) {}
  }
  function renderSoundBtn() {
    $("btn-sound").textContent = soundOn ? "🔊 효과음 켜짐" : "🔇 효과음 꺼짐";
  }
  $("btn-sound").addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem(SNDKEY, soundOn ? "on" : "off"); } catch (e) {}
    renderSoundBtn();
    if (soundOn) playSound(true); // 켤 때 미리듣기
  });
  renderSoundBtn();

  // ---- 설명글 크기 (한 번 정하면 저장·유지) ----
  const FSKEY = "older_quiz_descsize";
  let descSize = parseFloat(localStorage.getItem(FSKEY)) || 16.5;
  function applyDescSize() {
    descSize = Math.min(34, Math.max(12, descSize));
    document.documentElement.style.setProperty("--desc-size", descSize + "px");
    try { localStorage.setItem(FSKEY, String(descSize)); } catch (e) {}
  }
  $("font-minus").addEventListener("click", () => { descSize -= 1.5; applyDescSize(); });
  $("font-plus").addEventListener("click", () => { descSize += 1.5; applyDescSize(); });
  applyDescSize();

  // ---- 이벤트 ----
  function choose(ch) {
    if (view === "end") return;
    if (view !== progress() || view >= N) return;
    if (view < S.answers.length) return;
    S.answers.push(ch);
    playSound(isCorrect(view, ch));
    save();
    render();
  }
  $("btn-a").addEventListener("click", () => choose("a"));
  $("btn-b").addEventListener("click", () => choose("b"));

  $("btn-hint").addEventListener("click", () => {
    const i = view;
    if (i === "end" || i !== progress() || S.hints[i]) return;
    if (HINT_BUDGET - hintsUsed() <= 0) return;
    const s = sides(i);
    if (!(s.a.desc || s.b.desc)) return;
    S.hints[i] = true;
    save();
    render();
  });

  $("btn-prev").addEventListener("click", () => {
    if (view === "end") { view = N - 1; }
    else if (view > 0) view--;
    render();
  });
  $("btn-fwd").addEventListener("click", () => {
    if (view === "end") return;
    const maxView = Math.min(S.answers.length, N - 1);
    if (view < maxView) view++;
    else if (view === N - 1 && S.answers.length === N) view = "end";
    render();
  });
  $("btn-jump").addEventListener("click", () => {
    view = S.answers.length === N ? "end" : progress();
    render();
  });
  $("btn-review").addEventListener("click", () => { view = N - 1; render(); });

  $("btn-shuffle").addEventListener("click", () => {
    S = freshState(true); view = 0; save(); render();
  });
  $("btn-restart").addEventListener("click", () => {
    S = freshState(false); view = 0; save(); render();
  });
  $("btn-reset-all").addEventListener("click", () => {
    if (confirm("모든 기록을 지우고 처음부터 시작할까요?")) {
      S = freshState(false); view = 0; save(); render();
    }
  });

  // 키보드: ←/→ 탐색, Enter 다음 문제, Esc 연표 닫기, T 연표 열기
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeTimeline(); return; }
    if ($("tl-overlay").classList.contains("open")) return;
    if (e.key === "ArrowLeft") $("btn-prev").click();
    else if (e.key === "ArrowRight" || e.key === "Enter") {
      if (view !== "end" && !$("btn-fwd").disabled) $("btn-fwd").click();
    } else if (e.key === "t" || e.key === "T") openTimeline();
  });

  render();
})();
</script>
</body>
</html>
